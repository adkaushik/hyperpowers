# SQLite lives on the volume at /data, and a volume attaches to one Machine only,
# so this app runs exactly one Machine.
app = "hyperpowers-web"
primary_region = "bom"

[build]

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  DATABASE_PATH = "/data/hyperpowers.db"
  CLIENT_IP_HEADER = "fly-client-ip"

[[mounts]]
  source = "hyperpowers_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
